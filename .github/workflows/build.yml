name: Build and publish Caddy images

on:
  schedule:
    # 4:14 PM Mon UTC
    - cron: '14 16 * * 1'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/caddy-ts-dns

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        caddy-version: ['2.11']
        dns-provider: [cloudflare, porkbun, duckdns, route53]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: caddy-images-${{ matrix.dns-provider }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Caddy version
        id: caddy-version
        env:
          CADDY_VERSION: ${{ matrix.caddy-version }}
        run: |
          version_output="$(docker run --rm "caddy:${CADDY_VERSION}" caddy version)"
          version="${version_output%% *}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve a full Caddy version from: $version_output" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Go build mounts
        id: go-cache
        uses: actions/cache@v4
        with:
          path: cache-mount
          key: go-cache-${{ runner.os }}-${{ steps.caddy-version.outputs.version }}-${{ matrix.dns-provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-cache-${{ runner.os }}-${{ steps.caddy-version.outputs.version }}-

      - name: Restore BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: ./caddy-ts-dns/Dockerfile
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.caddy-version.outputs.version }},suffix=-${{ matrix.dns-provider }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.caddy-version.outputs.version }},suffix=-${{ matrix.dns-provider }}
            type=semver,pattern={{major}},value=${{ steps.caddy-version.outputs.version }},suffix=-${{ matrix.dns-provider }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./caddy-ts-dns
          file: ./caddy-ts-dns/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            CADDY_VERSION=${{ steps.caddy-version.outputs.version }}
            DNS_PROVIDER=${{ matrix.dns-provider }}
          cache-from: type=gha,scope=caddy-${{ steps.caddy-version.outputs.version }}-${{ matrix.dns-provider }}
          cache-to: type=gha,mode=max,scope=caddy-${{ steps.caddy-version.outputs.version }}-${{ matrix.dns-provider }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
